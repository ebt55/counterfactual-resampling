[project]
name = "blockpoint"
version = "0.1.0"
description = "Block-point swap: resample a DeepSeek-V4.1-flash agent at its first answer-file read, with the real file or a fake from another model family."
license = { text = "MIT" }
authors = [{ name = "Ebin Babu Thomas" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "pytest>=8",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blockpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["docker: needs Docker", "live: spends hosted tokens"]
pythonpath = ["src"]
